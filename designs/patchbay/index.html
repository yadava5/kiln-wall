<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patchbay</title>
<style>
@font-face{font-family:"Barlow";src:url(fonts/Barlow-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Barlow";src:url(fonts/Barlow-Medium.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Barlow Condensed";src:url(fonts/BarlowCondensed-Medium.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Barlow Condensed";src:url(fonts/BarlowCondensed-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Geist Mono";src:url(fonts/GeistMono-Variable.woff2) format("woff2");font-weight:100 900}

/* One look: Riso on black paper, the 1898 jack patent printed in gold behind the middle.
   An ink is an identity, and each family carries one dimension:
   - patch inks, one per session SLOT (--p1 mint, --p2 orange, --p3 yellow): the slot's
     tab, its hour chart, its layer in This hour, every cord it sends, its stripe in the
     Log, the glyph of each agent it has out. Sessions without a slot print in grey;
   - metallic inks for the models in the record: Opus white, Fable gold (gold is what the
     work costs: the expensive model and the week's allowance), the rest grey;
   - a warm two-ink ramp (red into sunflower) for tokens per hour: the Today dial and the
     hours of the week; a green ramp for GitHub's year;
   - fluorescent pink (ALERT) for whatever needs you.
   Words stay white and secondary. Flat fills, no glow, no gradient.
   Every box is cut once at load and never moves (v5). Two kinds of box:
   - plates (.plt): the live jackfield, smoked acrylic over the plate, drawn by an SVG
     outline with chamfered outer corners and half-round bushings on the channel edge,
     one per jack. An unpatched session slot has a socket hole cut through it;
   - cards (.card): the record and the machine, opaque, square-cornered.
   Print on the paper: the rail (clock, date, place).
   Each figure is printed in one place only (v6). */
:root{
  --g:#141414; --s:#1c1c1c; --e:#2e2e2e; --ink:#f3efe6; --sec:#d2cdc3; --idle:#7a776f; --rule:var(--idle);
  --alert:#ff48b0; --gold:#c9a96a;
  --p1:#82d8d5; --p2:#ff7a3d; --p3:#ffe800;
  --h0:#232323; --h1:#4d2117; --h2:#8f321d; --h3:#e2602a; --h4:#ffb32a;
  --gh0:#232323; --gh1:#1b4a32; --gh2:#1f6b43; --gh3:#2fa357; --gh4:#7fd65a;
  --m1:var(--ink); --m2:color-mix(in srgb,var(--ink) 55%,var(--g)); --m3:color-mix(in srgb,var(--ink) 30%,var(--g));
  --acr:rgba(28,28,28,.8); --well:rgba(28,28,28,.65); --acr-e:rgba(243,239,230,.13); --acr-top:rgba(243,239,230,.30);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--g);color:var(--ink)}
body{font-family:"Barlow",sans-serif;font-weight:400;font-size:13px;line-height:20px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
text{font-family:"Barlow",sans-serif;font-variant-numeric:tabular-nums;fill:var(--sec);font-size:11px}
svg{display:block;overflow:visible}
canvas{display:block}
.mono{font-family:"Geist Mono",monospace;font-size:12px}
#stage{position:absolute;left:0;top:0;width:1512px;height:982px;overflow:hidden}
#ground{position:absolute;left:0;top:0;width:1512px;height:982px;z-index:0;overflow:hidden}
/* the plate: ground.png is 1531 x 1832 at 2x = page 370-1135.5 x 54-970, centred on the
   channel (642-864), placed once */
#ground img{position:absolute;left:370px;top:54px;width:765.5px;height:916px}
#cards{position:absolute;left:0;top:0;width:1512px;height:982px;z-index:1}
#wires{position:absolute;left:0;top:0;width:1512px;height:982px;pointer-events:none;z-index:3}
/* a pulse: a bead in the cord's ink with a paper rim, so it reads on its own cord */
.pulse{position:absolute;left:0;top:0;z-index:4;border-radius:50%;pointer-events:none;border:2px solid var(--g);will-change:transform}

/* card stock: opaque, flat, square-cornered: the record and the machine */
.card{position:absolute;background:var(--s);border:1px solid var(--e);border-radius:2px;overflow:hidden}
.card.alert{border-color:var(--alert);box-shadow:inset 0 0 0 1px var(--alert)}
/* a plate: the SVG outline paints fill, well and edge behind the content (z -1 inside the
   plate's own stacking context), so a chamfer, a bushing or a socket hole is one crisp path */
.plt{position:absolute;z-index:0}
.plt>svg.plate{position:absolute;top:0;z-index:-1}
.plate .pf{fill:var(--acr)}
.plate .pw{fill:var(--well)}
.plate .pe{fill:none;stroke:var(--acr-e);stroke-width:1}
.plate .pt{fill:none;stroke:var(--acr-top);stroke-width:1}
.plate .jk{fill:var(--g);stroke:#4a4844;stroke-width:2}
.plate .bz{fill:var(--e);stroke:var(--acr-top);stroke-width:.75}
/* the agents' fixed rows, ruled like a designation card so an empty row reads as a free line */
.ruled{background:repeating-linear-gradient(to bottom,transparent 0 19px,var(--acr-e) 19px 20px)}
.plt.alert .pe{stroke:var(--alert);stroke-width:2}

.hd{display:flex;justify-content:space-between;align-items:baseline;height:32px;padding:7px 12px 0;border-bottom:1px solid var(--e);white-space:nowrap}
.plt .hd{border-bottom:none}
.hd .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;line-height:18px;letter-spacing:.01em;color:var(--ink);flex:none}
.hd .m{font-size:12px;line-height:18px;color:var(--sec);min-width:0;overflow:hidden;text-overflow:ellipsis;margin-left:12px}
.bd{padding:6px 12px 0}
.ab{position:absolute}
.r{display:flex;height:20px;line-height:20px;white-space:nowrap;align-items:baseline;overflow:hidden}
.r .k{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--sec);font-size:12px}
.r .n{flex:none;width:var(--nw,150px);text-align:right;color:var(--ink);overflow:hidden}
.r.l .k{flex:none;width:var(--kw,96px)}
.r.l .n{flex:1 1 auto;width:auto;text-align:left;min-width:0;text-overflow:ellipsis}
.big{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:28px;line-height:36px;letter-spacing:-.005em;color:var(--ink)}
.slot{display:inline-block;text-align:right;white-space:nowrap}
.cap{display:flex;justify-content:space-between;height:16px;line-height:16px;font-size:11px;color:var(--sec);white-space:nowrap}
.lbl{font-size:12px;line-height:20px;color:var(--sec);white-space:nowrap}
.g{display:inline-block;width:12px;text-align:left;color:var(--gc,var(--ink))}
.g.a{--gc:var(--pk,var(--idle))}.g.alert{--gc:var(--alert)}.g.idle{--gc:var(--idle)}.g.sec{--gc:var(--sec)}
.tag{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:11px;line-height:14px;padding:0 4px;border:1px solid var(--sec);border-radius:2px;color:var(--sec);vertical-align:1px;margin-left:6px}
.sw{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:0}

.bar{position:relative;height:6px;background:var(--e);overflow:hidden}
.plt .bar{background:rgba(243,239,230,.12)}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--bc,var(--ink));transform-origin:0 50%;transition:transform var(--kiln-tween,200ms) ease-out}
.vbars{display:flex;align-items:flex-end}
.vbars i{flex:none;position:relative;height:100%;overflow:hidden;background:transparent}
.vbars i b{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--bc,var(--ink));transform-origin:50% 100%;transition:transform var(--kiln-tween,200ms) ease-out}
/* This hour: one column a minute, its height the minute's output (a transform, so it
   glides), stacked inside by slot in the slots' inks, grey on top for everyone else. Each
   layer is placed by its own transform, never by layout. */
#hBars b{background:transparent}
#hBars b s{position:absolute;left:0;right:0;bottom:0;height:100%;transform-origin:50% 100%;transform:scaleY(0)}
.base{height:1px;background:var(--rule)}

/* the rails: printed straight on the paper, no box */
.rail{position:absolute;height:30px;display:flex;align-items:baseline;white-space:nowrap}
.rail>span{display:block;line-height:30px;color:var(--ink);flex:none;overflow:hidden}
.rail .clk{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:28px;letter-spacing:.005em;width:104px;text-align:right;margin-right:18px}
.rail .dt{font-size:15px;font-weight:500}
.rail .sec{color:var(--sec)}
.rail .fill{flex:1 1 auto;min-width:0;text-align:right}

/* a session slot: a jack plate, its patch ink as a tab along the top edge */
.sess .tab{position:absolute;left:12px;right:0;top:0;height:3px;background:var(--pk)}
.sess .hd .t{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
.sess .hd .m{flex:none;width:72px;text-align:right}
.sess .live,.sess .free{position:absolute;left:0;top:0;width:100%;height:100%}
.sess .free{display:none}
.sess.idle .live{display:none}
.sess.idle .free{display:block}
.sess.idle .tab{background:var(--e)}
.sess.idle .hd .t{color:var(--sec)}
.free .say{position:absolute;left:130px;top:93px;width:158px}
.free .say .lh{margin-top:6px}
.free .say b{display:block;font-weight:500;font-size:15px;line-height:20px;color:var(--ink)}
.free .say span{display:block;font-size:12px;line-height:18px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{position:absolute}
.agr{display:flex;height:20px;line-height:20px;white-space:nowrap;align-items:baseline}
.agr .k{flex:none;width:var(--kw,112px);overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-size:13px}
.agr .d{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--sec);font-size:12px;padding-right:8px}
.agr .n{flex:none;width:44px;text-align:right;color:var(--sec);font-size:12px}

/* the designation strip: a ticket listing the sessions without a slot */
#strip .tx{position:absolute;left:18px;right:18px;top:4px;height:20px;line-height:20px;font-size:12px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip .tx b{font-weight:500;color:var(--ink)}

/* the week's figure: a tag printed in the gold ink, the figure knocked out in paper */
.gtag{display:inline-block;width:96px;height:40px;background:var(--gold);color:var(--g);border-radius:2px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:30px;line-height:40px;text-align:center}
/* the call lamp: dark glass until someone waits */
.lamp{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--e);box-shadow:inset 0 0 0 1px var(--idle);margin-right:8px;vertical-align:-1px}
.card.alert .lamp{background:var(--alert);box-shadow:none}

.cores{display:flex;gap:2px;height:28px;align-items:flex-end;margin:2px 0 4px}
.cores i{flex:1 1 0;position:relative;height:100%;overflow:hidden;background:var(--e)}
.cores i b{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--m1);transform-origin:50% 100%;transition:transform var(--kiln-tween,200ms) ease-out}
.stack{display:flex;height:8px;background:var(--e);margin:4px 0 2px}
.stack i{display:block;height:100%}
.leg{display:flex;gap:10px;font-size:11px;line-height:16px;color:var(--sec);white-space:nowrap;overflow:hidden}
.leg i{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:-1px}
.log .e{display:flex;height:20px;line-height:20px;white-space:nowrap;gap:0}
.log .e .t{flex:none;width:56px;color:var(--sec);font-size:12px}
.log .e .s{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.log .e .nm{flex:none;max-width:96px;overflow:hidden;text-overflow:ellipsis;text-align:right;margin-left:8px;color:var(--sec);font-size:12px}
/* the Log's key: a stripe of the slot's ink beside the row's jack; a run of rows reads as
   one bar, and the cord from that slot lands on its first row */
.log .e .k{flex:none;width:4px;margin-right:10px;background:var(--pk,var(--e))}
table{border-collapse:collapse;width:100%;table-layout:fixed}
td,th{height:20px;padding:0;font-weight:400;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{color:var(--sec);font-size:11px;line-height:20px}
td:first-child,th:first-child{text-align:left}

.stat span{display:block;font-size:11px;line-height:14px;color:var(--sec)}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;line-height:26px;color:var(--ink)}
.hero-n{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:54px;line-height:56px;letter-spacing:-.01em;color:var(--ink)}
/* Today: the corners of the faceplate */
.cn{position:absolute;width:76px;white-space:nowrap}
.cn b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;line-height:26px;color:var(--ink)}
.cn>span{display:block;font-size:11px;line-height:14px;color:var(--sec)}
.cn.rt{text-align:right}

.tiny{position:absolute;left:12px;width:48px;background:var(--s);border:1px solid var(--e);border-radius:2px;overflow:hidden;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:11px;line-height:14px;color:var(--sec);white-space:nowrap}
.tiny b{font-weight:600;color:var(--ink);display:block}
.tiny.off{display:none}
#dot{display:block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin:11px auto 5px;opacity:.5;transition:opacity 300ms}
html.kiln-stale #dot{opacity:.15}
#per.hi{color:var(--p1)}
.ring{position:relative;width:34px;height:34px;margin:5px auto 0}
.ring svg{width:34px;height:34px}
.ring circle{fill:none;stroke-width:3}
.ring .tr{stroke:var(--e)}
.ring .fg{stroke:var(--m1);transform:rotate(-90deg);transform-origin:50% 50%}
.ring .ct{position:absolute;inset:0;line-height:34px;font-size:11px;font-weight:600;color:var(--ink)}
.meters{display:flex;justify-content:center;gap:10px;height:30px;align-items:flex-end}
.meters i{width:8px;height:30px;background:var(--e);position:relative;overflow:hidden}
.meters i b{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--m1);transform-origin:50% 100%;transition:transform var(--kiln-tween,200ms) ease-out}
.meters i.tx b{background:var(--m2)}
.twin{display:flex;justify-content:center}
.twin span{width:23px;display:block}
.twin.v span{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion: reduce){.bar>i,.vbars i b,.cores i b,.meters i b{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="ground"></div>
  <div id="cards"></div>
  <svg id="wires" viewBox="0 0 1512 982"></svg>
</div>
<script src="../_shared/kiln-runtime.js"></script>
<script src="patchbay.js"></script>
</body>
</html>
