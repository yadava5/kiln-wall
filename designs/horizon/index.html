<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Horizon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face {
    font-family: "Archivo";
    src: url("fonts/Archivo.ttf") format("truetype");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  :root {
    /* Lc measured with palmath.apca on the rendered pixels behind each block (see notes.md):
       values >= 75, labels >= 60. Sodium is light, not saturated, so it can carry text. */
    --ink: #f1f4f7;      /* values */
    --ink-2: #d6dde3;    /* labels */
    --ink-3: #c9d2da;    /* scale numerals, footnotes: smaller, not dimmer */
    --sodium: #ffcb80;   /* used, live, now: drawn light */
    --sodium-ink: #ffe6c2; /* sodium as text: lighter, so it holds Lc 75 under an overcast day */
    --caution: #ffc2a8;  /* general-purpose only */
  }
  html, body { margin: 0; height: 100%; background: #080b0e; overflow: hidden; }
  body {
    font-family: "Archivo", sans-serif;
    font-stretch: 108%;
    font-variant-numeric: tabular-nums lining-nums;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: absolute; left: 0; top: 0; width: 1512px; height: 982px; overflow: hidden; transform-origin: 0 0; }
  #stage > canvas, #clouds, #precip, #flash, #labels { position: absolute; left: 0; pointer-events: none; }
  /* the sky itself is #stage's background (horizon.js paintSky); only the moon's disc is drawn */
  #moon { top: 0; width: 28px; height: 28px; }
  #clouds { top: 0; width: 1512px; height: 480px; overflow: hidden; }
  #clouds canvas { position: absolute; left: 0; top: 0; width: 3024px; height: 480px; will-change: transform; }
  #precip { top: 0; width: 1512px; height: 982px; overflow: hidden; }
  /* 1x canvases a tile larger than the stage, translated mod 256 (horizon.js sizes them) */
  #precip .pl { position: absolute; left: -256px; top: -256px; will-change: transform; }
  /* the lightning layer exists only in a storm */
  #flash { top: 0; width: 1512px; height: 520px; opacity: 0; display: none;
    background: radial-gradient(ellipse 60% 70% at 62% 30%, rgba(196,206,232,.42), rgba(196,206,232,0) 70%); }
  .storm #flash { display: block; will-change: opacity; }
  #labels { top: 0; width: 1512px; height: 982px; }

  /* The lit band of the gate: a clip down to the horizon around one rotated canvas. */
  #band { position: absolute; overflow: hidden; pointer-events: none; }
  #band canvas { position: absolute; left: 0; will-change: transform; transition: transform var(--kiln-tween) ease-out; }
  /* The "used" label rides the band's tip; a hairline joins them when it had to step aside. */
  .used { transition: transform var(--kiln-tween) ease-out; }
  .ldr { position: absolute; left: 0; top: 0; width: 100px; height: 1px; transform-origin: 0 50%;
    background: rgba(255,214,150,.6); will-change: transform; transition: transform var(--kiln-tween) ease-out; }

  /* Running agents' columns of light (horizon.js makeCol): small layers, animated on the
     compositor. --c is the light's colour. */
  #cols { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
  .acol { position: absolute; left: 0; top: 0; --c: 255,228,186; will-change: transform, opacity; }
  .acol.gp { --c: 255,166,130; }
  .acol i { position: absolute; display: block; }
  .acol .rise { position: absolute; left: -7px; bottom: 0; width: 14px; transform-origin: 50% 100%; }
  .acol .gl { left: 0; bottom: 0; width: 14px; background: rgba(var(--c),.05); }
  .acol .sh { left: 6.1px; bottom: 0; width: 1.8px; height: 100%;
    background: linear-gradient(rgba(var(--c),0), rgba(var(--c),.55) 18%, rgb(var(--c))); }
  .acol .rf { left: -1.5px; top: 0; width: 3px; height: 70px; background: linear-gradient(rgba(var(--c),.45), rgba(var(--c),0)); }
  .acol .ft { left: -5px; top: -1.6px; width: 10px; height: 3.2px; border-radius: 50%; background: rgb(var(--c)); }
  .acol .cl { position: absolute; left: 0; transform: translateX(-50%); white-space: nowrap; line-height: 1.32; }

  /* Stills, quiet and reduced motion: everything lands at once. */
  .snap *, .snap *::before { transition: none !important; }

  /* Every label carries a dark halo, so the type keeps its contrast where a crest, a light
     column or the fog band passes behind it. Contrast is measured with the halo in place. */
  #stage { --halo: 0 0 2px rgba(6,8,11,.92), 0 1px 4px rgba(6,8,11,.85), 0 0 10px rgba(6,8,11,.6); }
  #labels, #cols, #clock, #wx, #gh, #gatec, .wing, #agents, #hero, #rail, #period, #fort, #log { text-shadow: var(--halo); }
  /* Each block is its own layout root, so a figure changing inside it relays out that block,
     not the page (the rail's figures change on every line). No paint containment: it would
     clip the halos at the box edge. */
  #clock, #wx, #gh, #gatec, .wing, #agents, #hero, #rail, #period, #fort, #log { contain: layout style; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.32; will-change: transform; }
  .ghost #stage * { color: transparent !important; }
  .k { color: var(--ink-2); font-size: 12px; }
  .v { color: var(--ink); font-size: 14px; font-weight: 500; }
  .f { color: var(--ink-3); font-size: 11px; }
  .r { text-align: right; }
  .warm { color: var(--sodium-ink); }
  .gp { color: var(--caution); }
  .blk { display: block; }
  .dl { text-align: center; }
  .dl .pk { color: var(--ink); }
  .fade { transition: opacity 360ms ease; }

  #clock { position: absolute; left: 92px; top: 46px; }
  #clock .t { font-size: 58px; font-weight: 220; font-stretch: 125%; letter-spacing: -0.01em; line-height: 1; }
  #clock .t small { font-size: 22px; font-weight: 300; margin-left: 7px; }
  #clock .d { font-size: 14px; color: var(--ink-2); margin-top: 9px; }

  #wx { position: absolute; left: 1196px; top: 46px; width: 300px; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
  #wx .tp { color: var(--ink); font-weight: 300; font-size: 30px; font-stretch: 122%; line-height: 1.05; }
  #wx .tp small { font-size: 15px; font-weight: 400; margin-left: 4px; }
  #wx .kd { color: var(--ink); font-size: 14px; font-weight: 450; margin-left: 8px; }

  #gatec { position: absolute; left: 756px; top: 140px; transform: translateX(-50%); text-align: center; }
  #gatec .big { font-size: 112px; font-weight: 180; font-stretch: 125%; line-height: 0.92; letter-spacing: -0.02em; }
  #gatec .big span { font-size: 44px; font-weight: 250; margin-left: 4px; }
  #gatec .sub { font-size: 14px; color: var(--ink); margin-top: 8px; }
  #gatec .cd { font-size: 19px; font-weight: 350; margin-top: 10px; font-stretch: 118%; }
  #gatec .rs { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  #gatec .fh { margin-top: 10px; }
  .wing { position: absolute; top: 254px; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
  .wing .hd { color: var(--ink-2); }
  .wing .v { font-size: 14px; }
  #wingl { right: calc(1512px - 560px); text-align: right; }
  #wingr { left: 952px; }

  #agents { position: absolute; left: 92px; top: 176px; width: 236px; }
  #agents .hd { font-size: 12px; color: var(--ink-2); margin-bottom: 7px; }
  #agents .row { position: relative; height: 52px; }
  #agents.dense .row { height: 48px; }
  .col { text-align: center; }
  #agents .row .v { font-size: 13.5px; }
  #agents .sp { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; row-gap: 1px; margin-top: 4px; }
  #agents .sp .n { font-size: 11px; color: var(--ink-3); text-align: right; }
  #agents .sp .bar { grid-column: 1 / 3; height: 1px; background: rgba(214,221,227,.18); margin: 3px 0 4px; }
  #agents .sp > span { line-height: 1.2; }
  #agents .sp .bar i { display: block; height: 1px; background: rgba(214,221,227,.8); transform-origin: 0 0; }
  #agents .sp .bar.gp i { background: var(--caution); }

  /* A lane's two lines are one label: tight inside, so the 40-46 px between lanes reads as
     the gap between labels (at 1.32 the pairs ran together at five sessions). */
  .lb.lane { font-size: 12px; line-height: 1.16; }

  /* The past fortnight's caption, under the far range's day labels (horizon.js
     updateFortnight). Kept left of x 560: the back lane's ridge reaches y 540 beyond it. */
  #fort { position: absolute; left: 92px; top: 520px; width: 470px; font-size: 11px; line-height: 1.42; color: var(--ink-3); }
  #fort .k { font-size: 12px; }
  #fort .v { font-size: 13px; }

  /* The latest events, on the open plain right of the lanes (horizon.js updateLog). Rows
     are absolutely placed and keyed, so a new event slides the rest down on the
     compositor; every box has a fixed size and each age sits right-aligned in its own slot. */
  #log { position: absolute; left: 1040px; top: 528px; width: 282px; height: 216px; }
  #log .hd { position: absolute; left: 0; top: 0; width: 282px; height: 16px; font-size: 12px; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log .er { position: absolute; left: 0; top: 0; width: 282px; height: 36px; transition: transform 360ms ease; }
  #log .ew, #log .ed { position: absolute; left: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log .ew { top: 0; width: 214px; font-size: 13px; font-weight: 450; color: var(--ink); line-height: 17px; }
  #log .ed { top: 18px; width: 282px; font-size: 11px; color: var(--ink-3); line-height: 15px; }
  #log .ea { position: absolute; right: 0; top: 2px; width: 64px; text-align: right; font-size: 11px; color: var(--ink-2); line-height: 15px; }
  #log .ew.warm { color: var(--sodium-ink); }
  #log .ew.gp { color: var(--caution); }

  #hero { position: absolute; left: 1040px; top: 772px; }
  #hero .k { margin-top: 6px; }
  #hero .f { line-height: 1.45; }
  #hero .big { font-size: 46px; font-weight: 200; font-stretch: 125%; color: var(--sodium-ink); line-height: 1; }

  #gh { position: absolute; left: 1196px; top: 226px; width: 300px; font-size: 12px; color: var(--ink-2); line-height: 1.5; }
  #gh .v { font-size: 15px; font-weight: 400; }
  #gh .sw2 canvas { display: block; width: 300px; height: 20px; margin: 7px 0 4px; }
  #gh .f { line-height: 1.4; }
  #rail { position: absolute; left: 1338px; top: 352px; width: 168px; }
  #rail .hd { font-size: 12px; color: var(--ink-2); padding: 0 0 9px 13px; }
  #rail .it { position: relative; padding: 0 0 13px 13px; border-left: 1px solid rgba(179,190,200,.3); }
  #rail .it::before { content: ""; position: absolute; left: -3px; top: 6px; width: 5px; height: 1px; background: rgba(223,230,236,.75); }
  #rail .k, #rail .f { display: block; }
  #rail .v { display: block; font-size: 21px; font-weight: 300; font-stretch: 120%; margin-top: 1px; }
  /* Rule 13: the figure's slot fits "99.9" exactly (measured in WebKit: 47.6 px at 21 px,
     2.266 em; "100" and "999" are narrower), right-aligned, so every unit in the rail starts
     on one column. em, not ch: the font's ch is its proportional zero, wider than tnum's. */
  #rail .v b { font-weight: inherit; display: inline-block; min-width: 2.27em; text-align: right; }
  #rail .v small { font-size: 12px; color: var(--ink-2); font-weight: 400; font-stretch: 108%; margin-left: 4px; }
  #rail .f { margin-top: 2px; line-height: 1.38; }
  /* footnote ledgers: label | figure, right-aligned in a column that fits "99.9" (2.27 em,
     as above) | unit column wide enough for "MB/s". Fixed columns: an auto one widened as
     a figure gained a digit, and every cell in it moved (dev-audit). */
  #rail .g { display: grid; grid-template-columns: minmax(0, 1fr) 2.27em 2.4em; column-gap: .3em; width: 128px;
    margin-top: 3px; font-size: 11px; line-height: 1.38; color: var(--ink-3); }
  #rail .g .gk { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rail .g .n { text-align: right; color: var(--ink-2); white-space: nowrap; }
  #rail .g .w { grid-column: 1 / 4; }
  #rail .g .gp { color: var(--caution); }
  #rail .sw { position: relative; width: 128px; height: 22px; margin-top: 5px; overflow: hidden; }
  #rail .sw canvas { position: absolute; left: 0; top: 0; width: 140px; height: 22px; will-change: transform; }
  #rail .cores { display: flex; gap: 2px; height: 14px; align-items: flex-end; margin-top: 5px; width: 128px; }
  #rail .cores i { flex: 1; height: 100%; background: rgba(223,230,236,.85); transform-origin: 50% 100%;
    will-change: transform; transition: transform var(--kiln-tween) ease-out; }

  #period { position: absolute; right: 16px; bottom: 12px; font-size: 11px; color: var(--ink-3);
    display: flex; align-items: center; transition: color 300ms; }
  /* the live dot: beats on Kiln.onBeat (horizon.js), rests at .5, dims when lines stop */
  #period i { width: 5px; height: 5px; border-radius: 50%; background: var(--sodium); opacity: .5;
    margin-right: 4px; transition: opacity 600ms ease; }
  html.kiln-stale #period i { opacity: .14; }
  /* fits "1000" (measured 27.0 px at 11 px) */
  #period b { font-weight: inherit; display: inline-block; width: 2.46em; text-align: right; margin-right: .3em; }
  #period.hi { color: var(--sodium-ink); }

  .focus .unfocus { opacity: .12; }
  .bare #labels, .bare #clock, .bare #wx, .bare #gatec, .bare .wing, .bare #agents, .bare #hero,
  .bare #rail, .bare #period, .bare #cols .cl, .bare #fort, .bare #log { visibility: hidden; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="moon"></canvas>
  <div id="clouds"><canvas></canvas></div>
  <canvas id="c-gate"></canvas>
  <div id="band"><canvas></canvas></div>
  <canvas id="c-far"></canvas>
  <canvas id="c-ground"></canvas>
  <canvas id="c-live"></canvas>
  <div id="cols"></div>
  <canvas id="c-fx"></canvas>
  <div id="precip"><canvas class="pl"></canvas><canvas class="pl"></canvas></div>
  <div id="flash"></div>
  <div id="labels"></div>

  <div id="clock"><div class="t"><span></span><small></small></div><div class="d"></div></div>
  <div id="wx" class="unfocus"></div>
  <div id="gh" class="unfocus"></div>
  <div id="gatec">
    <div class="big"><b style="font-weight:inherit"></b><span>%</span></div>
    <div class="sub">of this week's limit used</div>
    <div class="cd"></div>
    <div class="rs"></div>
    <div class="fh f"></div>
  </div>
  <div id="wingl" class="wing unfocus"></div>
  <div id="wingr" class="wing unfocus"></div>
  <div id="agents" class="unfocus"></div>
  <div id="fort" class="unfocus"></div>
  <div id="log" class="unfocus"></div>
  <div id="hero"></div>
  <div id="rail" class="unfocus"></div>
  <div id="period"><i></i><b></b><span>ms</span></div>
</div>
<script src="config.js"></script>
<script src="../_shared/kiln-runtime.js"></script>
<script src="astro.js"></script>
<script src="horizon.js"></script>
</body>
</html>
